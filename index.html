/* ===== TEMA (4 mode; angkasa di style v132) ===== */
:root{--r:22px;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[data-theme=terang]{--bg:#e9ecf6;--card:#f7f9fd;--card2:#fff;--tx:#17233f;--mu:#6b7794;--ac:#12b5c4;--ac2:#1b3a8a;--ln:#d8deec;--sh:8px 8px 20px #cfd5e6,-6px -6px 16px #fff;--hero:linear-gradient(135deg,#1b3a8a,#0e2358)}
[data-theme=biru]{--bg:#7f90b4;--card:#eef2fa;--card2:#fff;--tx:#17233f;--mu:#5d6b88;--ac:#12b5c4;--ac2:#243a73;--ln:#cfd7e8;--sh:0 10px 28px rgba(20,32,70,.28);--hero:linear-gradient(135deg,#243a73,#14224d)}
[data-theme=gelap]{--bg:#06182f;--card:#0c2342;--card2:#0f2b50;--tx:#e6eefc;--mu:#8ea3c7;--ac:#25d3e3;--ac2:#4c7dff;--ln:#1b3a66;--sh:0 10px 30px rgba(0,0,0,.45);--hero:linear-gradient(135deg,#0f3b73,#082448)}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
/* ===== KERANGKA ===== */
header{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;z-index:5;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--hero);display:grid;place-items:center;color:#fff;font-size:18px}
.sp{flex:1}
nav.pills{display:none;gap:8px}
nav button,.tabbar button{border:1px solid var(--ac);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
nav button.on{background:var(--ac);color:#04222a}
.themes{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:var(--sh)}
.themes button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:16px}
.themes button.on{background:var(--ac);color:#04222a}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:6}
.tabbar button{border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 10px;color:var(--mu);border-radius:14px}
.tabbar button.on{color:var(--ac2);background:var(--card2)}
[data-theme=gelap] .tabbar button.on{color:var(--ac)}
.tabbar svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1100px;margin:0 auto;padding:6px 16px 24px}
h1{font-size:22px;margin:6px 0 14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.hero{background:var(--hero);color:#fff}
.card h3{font-size:14px;color:var(--mu);font-weight:600;margin-bottom:6px}
.hero h3{color:#b9d7ff}
.big{font-size:34px;font-weight:800}
.mut{color:var(--mu);font-size:13px;line-height:1.5}
.btn{border:0;background:var(--ac);color:#04222a;font-weight:700;padding:11px 18px;border-radius:14px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--ln)}
.btn.red{background:#e5484d;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
/* ===== FORM ===== */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mu)}
input:disabled{opacity:.6}
input[type=text]{background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;color:var(--tx)}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.save{font-size:12px;font-weight:700;color:var(--ac);display:flex;align-items:center;gap:6px;opacity:.9}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.save.busy i{background:#f5a524}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:10px 18px;border-radius:14px;z-index:9;font-size:14px;box-shadow:var(--sh)}
.logoprev{width:70px;height:70px;object-fit:contain;border-radius:12px;background:var(--card2);border:1px solid var(--ln)}
/* ===== SISWA ===== */
.sw{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.sw:last-child{border:0}.sw>b{width:28px;color:var(--mu);text-align:right}.sw>div{flex:1;min-width:0}.sw>div b{display:block;font-size:14px}
.sm{border:1px solid var(--ln);background:var(--card2);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:13px}
dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--tx);padding:20px;width:min(420px,92vw);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.45)}.dlg{display:grid;gap:12px}.err{color:#e5484d;font-size:13px;min-height:1em}
textarea{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:11px;color:var(--tx);font:inherit}
details summary{cursor:pointer;font-weight:700}
/* ===== INPUT NILAI ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:#04222a;border-color:var(--ac)}.chip small{opacity:.7}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:44px;min-height:42px;border:1px solid var(--ln);background:var(--card2);border-radius:12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.it{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it>span{font-weight:600;font-size:14px}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:6px}.nav .mid{flex:1;text-align:center}.nav b{display:block}.nav .sm{font-size:20px;padding:6px 16px}
select{width:100%;background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:11px;color:var(--tx)}
.pos{margin-top:4px}
@media(min-width:620px){.it{grid-template-columns:1fr 1.2fr;align-items:center}}
@media(min-width:820px){nav.pills{display:flex}.tabbar{display:none}body{padding-bottom:20px}}

/* ===== SETORAN ===== */
input[type=date]{width:100%;background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;color:var(--tx)}
.fl{display:grid;gap:12px}.fl .btn{padding:14px}

select:disabled{opacity:.5}

@media(min-width:1024px){html[data-theme=angkasa] body::before{background-size:62% auto;background-position:right 40%;-webkit-mask-image:linear-gradient(90deg,transparent 37%,#000 58%);mask-image:linear-gradient(90deg,transparent 37%,#000 58%)}}
@media print{html[data-theme=angkasa],html[data-theme=angkasa] body{background:#fff!important;color-scheme:light}html[data-theme=angkasa] body::before{display:none!important}}
html[data-theme=angkasa] header{background:linear-gradient(180deg,rgba(22,23,27,.95),rgba(22,23,27,.6));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html[data-theme=angkasa] h1{text-shadow:0 2px 0 rgba(0,0,0,.45)}
html[data-theme=angkasa] .themes{background:linear-gradient(180deg,#2e2f36,#202126);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 3px 0 #111214,0 9px 14px rgba(0,0,0,.5)}
html[data-theme=angkasa] .themes button.on{background:radial-gradient(circle at 32% 26%,#ffc98f,#ff8a2a 55%,#c9490c);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px rgba(255,106,19,.35);color:#2a1204}
/* kartu = lembar kertas bertumpuk */
html[data-theme=angkasa] .card,html[data-theme=angkasa] .gr,html[data-theme=angkasa] .gsm,html[data-theme=angkasa] dialog{background:var(--kertas);border:0}
html[data-theme=angkasa] .grid{gap:22px}
html[data-theme=angkasa] .glist{gap:18px}
html[data-theme=angkasa] .card[style*="margin-top:16px"]{margin-top:24px!important}
html[data-theme=angkasa] .card h3::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px;background:radial-gradient(circle at 32% 28%,#ffd2a1,#ff8a2a 52%,#a93a07);box-shadow:0 2px 3px rgba(0,0,0,.55)}
html[data-theme=angkasa] .card:nth-child(4n+2) h3::before{background:radial-gradient(circle at 32% 28%,#a6f3f9,#1fb6c4 52%,#0a5560)}
html[data-theme=angkasa] .card:nth-child(4n+3) h3::before{background:radial-gradient(circle at 32% 28%,#c4d3f3,#5f80bd 52%,#2b3f6e)}
html[data-theme=angkasa] .card:nth-child(4n+4) h3::before{background:radial-gradient(circle at 32% 28%,#f8e3b9,#d9a24a 52%,#8a5b17)}
html[data-theme=angkasa] .card.hero h3::before{display:none}

.kcw2{border-left:4px solid #f5a524;margin-bottom:12px}
/* v1.36 */
.kcd select{flex:1;min-width:0}
/* v1.37 */
html.zm header,html.zm #navSide,html.zm main,html.zm .tabbar,html.zm dialog,html.zm .toast{zoom:var(--zm)}
html.fhp body{max-width:520px;margin:0 auto}
html.fhp .tabbar{left:50%;right:auto;width:100%;max-width:520px;transform:translateX(-50%)}
/* v1.38 pilih kelas, default per perangkat, atur A/B */
#gerbang{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--tx);overflow:auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
.pkw{width:100%;max-width:560px}.pkw h1{margin:8px 0 12px}.pki{margin:0 0 4px;min-height:44px}
.pkg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.pkt{display:grid;gap:4px;align-content:start;min-height:92px;padding:14px;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.pkt .pkh{display:flex;align-items:center;gap:8px}.pkt .pkh b{font-size:26px;line-height:1;color:var(--ac2)}
[data-theme=gelap] .pkt .pkh b,html[data-theme=angkasa] .pkt .pkh b{color:var(--ac)}
.pkt.on{outline:2px solid var(--ac2)}.pkt.kosong{opacity:.6}.pkt .pkg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abt{flex-wrap:nowrap}.abt button{min-width:0;padding:0 2px}.abt button small{display:block;font-size:11px;font-weight:600;opacity:.75}
.kr.abr{grid-template-columns:1fr auto}.kr.abr .kn{grid-column:auto}
/* v1.39 rapikan UI/UX HP: header ringkas, kelas kosong dilipat, target sentuh >=40px */
.kcd label{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.kcd input[type=text]{width:100%;min-width:0}
@media(max-width:480px){
.ksw{flex:none}.ksw select{width:auto;max-width:none;min-width:0;padding:0 6px}
.themes button:not(.on){display:none}.themes{padding:4px;gap:0}.themes button.on{width:34px;height:34px}
}
.card.kc{display:block;padding:18px;border-radius:var(--r);font-size:inherit;font-weight:inherit;white-space:normal}
@media(max-width:440px){.save span{display:none}}
@media(max-width:820px){.sm,.chip{min-height:40px}.hd .btn,.mbtn{min-height:40px}summary{padding:8px 0}}

<style id="v140">
/* ===== v1.40 POLES TEMA (Terang, Biru, Gelap, Angkasa) =====
 Sistem: (1) teks >= 4.5:1 dan komponen UI >= 3:1 di keempat tema; (2) satu token per peran:
 --mu teks redup, --acf isian aksi (teks putih), --warn peringatan, --dng galat, --fok cincin fokus;
 (3) semua perubahan hanya di blok ini; bagian terlindungi (rapor/cetak) tidak disentuh;
 (4) tanpa :is() dan tanpa fitur CSS baru agar aman di WebView lama. */
html{--acf:var(--ac2);--warn:#f59e0b;--dng:#e5484d;--fok:var(--ac)}
/* 1. Skema warna bawaan peramban: kontrol formulir, bilah gulir, pemilih tanggal */
[data-theme=terang],[data-theme=biru]{color-scheme:light}
[data-theme=gelap]{color-scheme:dark}
@media print{[data-theme=gelap]{color-scheme:light}}
/* 2. TERANG: teks redup #6b7794 (4.25:1) -> #56627f (5.8:1 di kartu, 5.2:1 di latar) */
[data-theme=terang]{--mu:#56627f;--warn:#a35207;--dng:#c4262d;--fok:var(--ac2)}
/* 3. BIRU: teks redup langsung di latar #7f90b4 hanya 1.67:1. --mu = navy di luar kartu, abu-biru di dalam kartu */
[data-theme=biru]{--mu:#1b2748;--warn:#a35207;--dng:#c4262d;--fok:var(--ac2)}
[data-theme=biru] .card,[data-theme=biru] .tabbar,[data-theme=biru] dialog,[data-theme=biru] .themes,[data-theme=biru] .gr,[data-theme=biru] .gsm,[data-theme=biru] .last,[data-theme=biru] .mnu,[data-theme=biru] .rkp-w,[data-theme=biru] .rt-w,[data-theme=biru] .nlf,[data-theme=biru] .swh,[data-theme=biru] .stQ,[data-theme=biru] .chip,[data-theme=biru] .sm,[data-theme=biru] .seg button,[data-theme=biru] .btn.ghost,[data-theme=biru] .gact .gal,[data-theme=biru] .nav.stk,[data-theme=biru] label.stk,[data-theme=biru] input,[data-theme=biru] select,[data-theme=biru] textarea{--mu:#4f5d7a}
/* 4. GELAP: --ac2 dipakai sebagai isian (putih di atasnya 3.69:1) dan sebagai teks di kartu gelap (4.26:1). Dipisah: --acf isian, --ac2 teks */
[data-theme=gelap]{--ac2:#7aa0ff;--acf:#3a63e0;--dng:#ff7b7f}
.toast,.seg button.on,.gtool .sm.on,.gc .gsl.on,.kcb{background:var(--acf)}
/* 5. Tombol bahaya: putih di atas #c9302c = 5.3:1 (sebelumnya 3.9:1; Angkasa 2.0:1 di ujung gradien) */
.btn.red{background:#c9302c}
html[data-theme=angkasa] .btn.red{background:radial-gradient(130% 150% at 28% 8%,#d13b41 0%,#c0262d 48%,#94191f 100%)}
/* 6. Galat dan peringatan memakai token per tema */
.err{color:var(--dng)}
.gag.w,.gnote{color:var(--warn)}
/* 7. Teks sekunder yang diredupkan lewat opacity */
.chip small{opacity:.86}.abt button small{opacity:.94}
/* 8. Cincin fokus: semua kontrol (dulu hanya input dan button), warna cukup kontras di latar terang */
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--fok);outline-offset:2px}
/* 9. Indikator simpan/sinkron di latar terang: teks cyan 1.98:1 (Terang) dan 1.24:1 (Biru). Cincin menjaga titik tetap terlihat walau warnanya diberi inline oleh JS */
[data-theme=terang] .save,[data-theme=biru] .save{color:var(--mu);opacity:1}
[data-theme=terang] .save i,[data-theme=biru] .save i{background:#0e7c8a;box-shadow:0 0 0 1px var(--mu)}
[data-theme=terang] .save.busy i,[data-theme=biru] .save.busy i{background:#8a4b00}
/* 10. Placeholder mengikuti token tema */
::placeholder{color:var(--mu);opacity:1}
/* 11. Ikon tema: satu keluarga garis; area sentuh 44px di layar sentuh tanpa mengubah tata letak */
.themes button svg{stroke-linecap:round;stroke-linejoin:round}
@media(pointer:coarse){.themes button{position:relative}.themes button::after{content:"";position:absolute;top:-5px;right:-5px;bottom:-5px;left:-5px}}
</style>

<script type="text/plain" id="proyek-instruksi">
# INSTRUKSI PROYEK — Aplikasi BTQ–Tahfidz (leger & rapor), dikerjakan lintas akun/chat
Blok ini TETAP: disalin tanpa perubahan di setiap sesi, kecuali perubahan permanen (bagian 6). Isi blok hanya instruksi dan status proyek, bukan data pengguna. Jangan pernah mencetak isi base64 atau data REKAP_BAWAAN.

## 0. Protokol sesi (WAJIB, kerjakan paling pertama)
1. Ekstrak kedua blok (PATH_FILE = file -sN yang diunggah):
import re
t=open(PATH_FILE,encoding='utf-8').read()
def blok(i):
    return re.search(r'id="'+i+r'">\n(.*?)\n<'+'/scr'+'ipt>',t,re.S).group(1)
open('instruksi.md','w',encoding='utf-8').write(blok('proyek-instruksi'))
open('handoff.md','w',encoding='utf-8').write(blok('proyek-handoff'))

Baca handoff.md sampai habis; tentukan nomor sesi (N+1), tahap selesai, dan tahap berikutnya. Baca juga pesan pengguna: tangani permintaan tambahan sesuai bagian 6 sebelum memilih tahap.
2. Cocokkan file dengan handoff. Jika berbeda, percayai file dan catat ketidakcocokan.
3. Simpan fingerprint.py dan golden.py dari handoff, jalankan pada file; hasilnya harus sama dengan tabel baku. Jika berbeda, perbaiki dulu.
4. Kerjakan tahap berikutnya. Boleh beberapa tahap berurutan, tetapi hanya berhenti di batas tahap dengan aplikasi utuh dan berjalan. Jangan menyerahkan aplikasi setengah jadi.
5. Tulis handoff_baru.md, tanam ke file, simpan sebagai aplikasi-btq-tahfidz-s{N+1}.html (jangan menimpa nama lama):
import re
t=open(PATH_FILE_HASIL_KERJA,encoding='utf-8').read()
new=open('handoff_baru.md',encoding='utf-8').read()
assert '<'+'/scr'+'ipt' not in new.lower()
pat=r'(id="proyek-handoff">\n).*?(\n<'+'/scr'+'ipt>)'
t=re.sub(pat,lambda m:m.group(1)+new.rstrip()+m.group(2),t,flags=re.S)
open('aplikasi-btq-tahfidz-sNEXT.html','w',encoding='utf-8').write(t)

Blok instruksi disalin tanpa perubahan. Jalankan ulang fingerprint.py, golden.py, dan node --check pada file akhir (setelah penanaman).
6. Serahkan hanya satu file lewat present_files, dengan ringkasan 5–8 baris: yang selesai, hasil uji, hal yang perlu diputuskan pengguna.

## 1. Konteks aplikasi (fakta teknis; nama kode untuk dicari dengan grep, nomor baris bergeser)
- Satu file HTML (~320 KB), JS murni tanpa framework, satu skrip utama (diawali 'use strict' dan const VERSI). Data besar yang jangan ditampilkan: 4 @font-face Carlito base64 di CSS, LOGO_DEF (JPEG base64), REKAP_BAWAAN (JSON besar berisi nama siswa).
- Penyimpanan: IndexedDB 'btq-tahfidz' versi 1. Store kv (kunci 'pengaturan' = S.set) dan siswa (keyPath id). Objek DB: open/get/set/all/put/saveSiswa/clear. JANGAN menaikkan versi DB; field baru cukup ditambah pada objek siswa/pengaturan.
- State S: set, siswa[], page, rp (indeks siswa di Rapor), sel (Set id untuk cetak terpilih), in (Input Nilai: mode, tab, i, j). ST = state halaman Setoran. Halaman: PAGES + VIEWS[p]() menghasilkan HTML, render() memanggil bindX; go(p) mengatur hash; tema data-theme terang/biru/gelap.
- Pengaturan S.set: madrasah, kelas, semester ('I (Satu)'/'II (Dua)'), tp ('2024/2025'), tempat ('Kota, 20 Juni 2025'), kota, guru, kepala, target, tema, logo, auto. autoSet() mengisi semester/tp/tempat dari tanggal hari ini (Juli–Desember = Semester I) bila auto!==false; dipanggil di render(), cetak(), boot. saved() = autosave 400 ms; persist() menomori ulang siswa dan menyimpan; sv(s)/svAll().

# fingerprint.py - sidik jari bagian terlindungi. Pakai: python3 fingerprint.py FILE.html
import sys,hashlib
BAGIAN=[  # (nama, penanda awal [termasuk], penanda akhir [tidak termasuk]); kemunculan pertama
 ('css-halaman','.pvw{margin:14px auto 0','.dn{display:flex'),
 ('css-cetak','@media print{#printArea .page{height:296.5mm','.s1{font-size:11.33pt'),
 ('css-gaya-s1-s64','.s1{font-size:11.33pt','</style>'),
 ('js-RP-LOGO','const RP={','function rval('),
 ('js-rval-raporHTML-fitText','function rval(k,s)','function cetak('),
]
BAKU={'css-halaman': '4c3caef28fba99f9', 'css-cetak': 'b5a8ce76a560a43c', 'css-gaya-s1-s64': '4e3f19359c34b25a', 'js-RP-LOGO': 'a8e731b636ea2af4', 'js-rval-raporHTML-fitText': '1c14ab2b6c9b0542'}  # baku sesi 0 (file asli v1.5)
def sidik(t):
    r={}
    for n,a,b in BAGIAN:
        i=t.find(a); assert i>=0,'penanda awal hilang: '+n
        j=t.find(b,i+len(a)); assert j>=0,'penanda akhir hilang: '+n
        r[n]=hashlib.sha256(t[i:j].encode('utf-8')).hexdigest()[:16]
    return r
if __name__=='__main__':
    r=sidik(open(sys.argv[1],encoding='utf-8').read()); ok=True
    for n,h in r.items():
        s='' if not BAKU else ('  OK' if BAKU.get(n)==h else '  BEDA'); ok&=(not BAKU or BAKU.get(n)==h)
        print(f'{n:28s}{h}{s}')
    if BAKU: print('HASIL:','SAMA dengan baku' if ok else 'BERBEDA dari baku'); sys.exit(0 if ok else 1)
